<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>Trainingstagebuch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <nav class="tabbar">
      <div class="brand"><span class="logo"></span><span>Trainings&shy;tagebuch</span></div>
      <button data-tab="today" class="active">
        <svg viewBox="0 0 24 24"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
        <span>Heute</span>
      </button>
      <button data-tab="calendar">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Kalender</span>
      </button>
      <button data-tab="stats" class="desk-only">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Auswertung</span>
      </button>
      <button data-tab="perf">
        <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>
        <span>Leistung</span>
      </button>
      <button data-tab="notes">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>
        <span>Notizen</span>
      </button>
      <button data-tab="more">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        <span>Mehr</span>
      </button>
    </nav>

    <div class="content">
      <header class="topbar">
        <div id="topLeft"></div>
        <div class="title-wrap">
          <h1 id="title">Heute</h1>
          <button id="syncDot" class="sync-dot" aria-label="Synchronisieren" hidden></button>
        </div>
        <div id="topRight"></div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="sheet" id="sheet"></div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="tip" class="tip hidden"></div>

  <script src="app.js"></script>
</body>
</html>
